<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviço · MecaGestão</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="servicos">
<main>
  <p class="migalha"><a href="servicos.html">Serviços</a></p>
  <div class="topo"><h1 data-editar-texto="Editar serviço">Novo serviço</h1></div>
  <form data-voltar="servicos.html">
    <div class="cartao campos">
      <div class="campo"><label for="nome">Nome</label><input id="nome" required data-editar="Alinhamento e balanceamento"></div>
      <div class="campo"><label for="preco">Preço base (R$)</label><input id="preco" type="number" min="0" step="0.01" required data-editar="150.00"></div>
      <div class="campo largo"><label for="descricao">Descrição</label><textarea id="descricao" data-editar="Alinhamento da direção e balanceamento das quatro rodas."></textarea></div>
    </div>
    <div class="rodape-form"><a class="btn" href="servicos.html">Cancelar</a><button class="btn primario">Salvar</button></div>
  </form>
</main>
<script src="js/app.js"></script>
</body>
</html>
