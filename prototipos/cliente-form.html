<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cliente · MecaGestão</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="clientes">
<main>
  <p class="migalha"><a href="clientes.html">Clientes</a></p>
  <div class="topo"><h1 data-editar-texto="Editar cliente">Novo cliente</h1></div>
  <form data-voltar="clientes.html">
    <div class="cartao campos">
      <div class="campo largo"><label for="nome">Nome</label><input id="nome" required data-editar="Carlos Eduardo Lima"></div>
      <div class="campo"><label for="cpf">CPF</label><input id="cpf" required placeholder="000.000.000-00" data-editar="222.222.222-22"></div>
      <div class="campo"><label for="telefone">Telefone</label><input id="telefone" required placeholder="(00) 00000-0000" data-editar="(47) 90000-0002"></div>
      <div class="campo largo"><label for="email">E-mail</label><input id="email" type="email" data-editar="carlos@example.com"></div>
    </div>
    <div class="rodape-form"><a class="btn" href="clientes.html">Cancelar</a><button class="btn primario">Salvar</button></div>
  </form>
</main>
<script src="js/app.js"></script>
</body>
</html>
